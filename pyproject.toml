[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtool"
version = "0.1.0-alpha3"
description = "A privacy-first, local CLI tool powered by Ollama"
authors = [{name = "AI Developer"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "requests",
    "rich",
    "tomli; python_version < '3.11'",
    "faiss-cpu",
    "numpy",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-php>=0.21",
    "tree-sitter-c-sharp>=0.21",
]

[project.scripts]
devtool = "devtool.main:app"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock",
    "pytest-cov",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["devtool"]
omit = [
    "devtool/test_*.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

[tool.black]
target-version = ["py310", "py311", "py312"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
