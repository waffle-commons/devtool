[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtool"
version = "0.1.0-alpha2"
description = "A privacy-first, local CLI tool powered by Ollama"
authors = [{name = "AI Developer"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "requests",
    "rich",
    "tomli; python_version < '3.11'",
    "faiss-cpu",
    "numpy",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-php>=0.21",
    "tree-sitter-c-sharp>=0.21",
]

[project.scripts]
devtool = "devtool.main:app"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock",
    "pytest-cov"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["devtool"]
omit = [
    "devtool/test_*.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
