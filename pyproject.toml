[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devtool"
version = "0.1.0-alpha3"
description = "A privacy-first, local CLI tool powered by Ollama"
authors = [{name = "AI Developer"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "click>=8.1",
    "requests",
    "rich",
    "faiss-cpu",
    "numpy",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-php>=0.21",
    "tree-sitter-c-sharp>=0.21",
]

[project.scripts]
devtool = "devtool.main:app"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock",
    "pytest-cov",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["devtool"]
omit = [
    "devtool/test_*.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false

[tool.black]
target-version = ["py312"]
line-length = 88

# Explicit rule set: ruff 0.17 widened its defaults, which broke CI on unchanged code.
# Stricter rules are adopted on purpose, in their own commit (RFC 028, P8).
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.isort]
profile = "black"
line_length = 88
